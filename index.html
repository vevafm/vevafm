<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
body { background:transparent; display:flex; justify-content:center; align-items:center; padding:2px; }

.player-card {
background: #061c12; color: #fff; width: 100%; max-width: 390px;
padding: 12px 14px 8px 14px; border-radius: 14px;
box-shadow: 0 6px 20px rgba(0,0,0,.25);
display: flex; flex-direction: column; gap: 8px;
position: relative; overflow: hidden; border: 1px solid #0a2e1d;
}

.top-header {
display: flex; justify-content: space-between; align-items: center;
width: 100%; gap: 8px;
}

.station-branding {
display: flex; align-items: baseline; gap: 6px;
min-width: 0; overflow: hidden;
}

.station-name {
font-size: 15px; font-weight: 900; color: #a3e6c9;
letter-spacing: .5px; text-transform: uppercase; flex-shrink: 0;
}

.station-slogan {
font-size: 11px; font-weight: 500; color: #7ac9a6;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.badge-aovivo {
background: rgba(229, 27, 36, 0.15); color: #ff4d55; font-size: 9px; font-weight: 800;
padding: 2px 7px; border-radius: 20px; display: flex;
align-items: center; gap: 4px; border: 1px solid rgba(229, 27, 36, 0.3);
letter-spacing: .5px; flex-shrink: 0;
}

.dot { width: 5px; height: 5px; background: #ff4d55; border-radius: 50%; animation: pulse 1.5s infinite; }

@keyframes pulse {
0% { transform:scale(.95); opacity:.8; }
50% { transform:scale(1.35); opacity:1; }
100% { transform:scale(.95); opacity:.8; }
}

.main-row {
display: flex; align-items: center; gap: 12px; width: 100%;
}

.album-art-container {
width: 68px; height: 68px; border-radius: 8px; overflow: hidden;
background: #0a2e1d; flex-shrink: 0; position: relative;
display: flex; justify-content: center; align-items: center;
border: 1px solid #144d31; box-shadow: 0 3px 8px rgba(0,0,0,.3);
}

.album-art { width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; display:none; }

.album-placeholder {
font-size: 24px; color: #00875a; display: flex;
align-items: center; justify-content: center; width: 100%;
height: 100%; position: absolute; top: 0; left: 0;
background: #0a2e1d; z-index: 2;
}

.player-content {
display: flex; flex-direction: column; flex-grow: 1; min-width: 0;
}

.now-playing-label {
font-size: 9px; font-weight: 800; color: #52b788;
letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1px;
}

.song-title {
font-size: 13px; font-weight: 700; color: #ffffff;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
max-width: 100%; margin-bottom: 8px;
}

.controls-row { display: flex; align-items: center; gap: 8px; width: 100%; }

.btn-play {
background: linear-gradient(135deg,#00875a,#006644);
border: none; width: 34px; height: 34px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
cursor: pointer; transition: all .2s ease;
box-shadow: 0 2px 6px rgba(0,135,90,.4); flex-shrink: 0;
}

.btn-play:hover { transform: scale(1.05); background: linear-gradient(135deg,#009e6a,#007a52); }
.btn-play svg { width: 16px; height: 16px; fill: #fff; }

.volume-container {
display: flex; align-items: center; gap: 6px; flex-grow: 1;
background: #0a2e1d; padding: 5px 8px;
border-radius: 20px; border: 1px solid #144d31;
}

.volume-icon { width: 13px; height: 13px; fill: #a3e6c9; flex-shrink: 0; }

.volume-slider { -webkit-appearance: none; width: 100%; height: 3px; background: #144d31; border-radius: 2px; outline: none; }

.volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; border-radius: 50%; background: #00875a; cursor: pointer; }

.player-footer {
border-top: 1px solid #0f3824;
margin-top: 4px;
padding-top: 6px;
display: flex;
align-items: center;
justify-content: center;
gap: 6px;
font-size: 11px;
color: #b7e4c7;
font-weight: 600;
}

.instagram-icon {
width: 14px;
height: 14px;
flex-shrink: 0;
}
</style>
</head>
<body>
<div class="player-card">
  <div class="top-header">
    <div class="station-branding">
      <span class="station-name">Veva FM</span>
      <span class="station-slogan">A rádio do nosso coração</span>
    </div>
    <div class="badge-aovivo"><span class="dot"></span> AO VIVO</div>
  </div>

  <div class="main-row">
    <div class="album-art-container">
      <div class="album-placeholder" id="artPlaceholder">🎵</div>
      <img id="albumArt" class="album-art" alt="Capa da música">
      <img id="centovaArt" class="cc_streaminfo" data-type="trackimageurl" data-username="william" style="display:none" alt="">
    </div>

    <div class="player-content">
      <div class="now-playing-label">Tocando Agora</div>
      <div class="song-title" id="songTitle">Veva FM - No Ar</div>

      <div class="controls-row">
        <button class="btn-play" id="playBtn" onclick="togglePlay()">
          <svg id="playIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <div class="volume-container">
          <svg class="volume-icon" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
        </div>
      </div>
    </div>
  </div>

  <div class="player-footer">
    <svg class="instagram-icon" viewBox="0 0 24 24">
      <defs>
        <radialGradient id="ig-gradient" cx="30%" cy="107%" r="150%">
          <stop offset="0%" stop-color="#fdf497"/>
          <stop offset="5%" stop-color="#fdf497"/>
          <stop offset="45%" stop-color="#fd5949"/>
          <stop offset="60%" stop-color="#d6249f"/>
          <stop offset="90%" stop-color="#285AEB"/>
        </radialGradient>
      </defs>
      <path fill="url(#ig-gradient)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
    </svg>
    <span>Siga a Veva FM no Instagram: @veva.fm</span>
  </div>
</div>

<audio id="radioAudio" preload="none">
<source src="https://usa3.fastcast4u.com/proxy/william?mp=/stream" type="audio/mpeg">
<source src="https://usa3.fastcast4u.com/proxy/william/;stream.mp3" type="audio/mpeg">
<source src="https://usa3.fastcast4u.com/start/william" type="audio/mpeg">
</audio>

<script>
(function(){
  var centova = window.centovacast || (window.centovacast = {});
  centova.streaminfo = centova.streaminfo || {};
  centova.streaminfo.config = {
    poll_limit: 1000,
    poll_frequency: 2000
  };
})();
</script>
<script src="https://usa3.fastcast4u.com/system/streaminfo.js"></script>

<script>
const audio = document.getElementById('radioAudio');
const playIcon = document.getElementById('playIcon');
const songTitle = document.getElementById('songTitle');
const albumArt = document.getElementById('albumArt');
const centovaArt = document.getElementById('centovaArt');
const artPlaceholder = document.getElementById('artPlaceholder');

audio.volume = 1;

let currentSong = "";
let fallbackStarted = false;
let centovaLoaded = false;
let searchNumber = 0;
let allowCentovaUpdate = false;
let displayedCentovaUrl = "";
let candidateCentovaUrl = "";

function togglePlay() {
  if (audio.paused) {
    audio.play().then(() => {
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }).catch(err => console.error(err));
  } else {
    audio.pause();
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
}

function changeVolume(val) {
  audio.volume = val;
}

function showImage(url, requestId) {
  const testImage = new Image();

  testImage.onload = function() {
    if (requestId !== searchNumber) return;

    albumArt.src = url;
    albumArt.style.display = 'block';
    artPlaceholder.style.display = 'none';
  };

  testImage.onerror = function() {
    if (requestId === searchNumber) showNote();
  };

  testImage.src = url;
}

function showNote() {
  albumArt.style.display = 'none';
  artPlaceholder.style.display = 'flex';
}

function searchOnline(song, requestId) {
  const term = encodeURIComponent(song);

  fetch('https://itunes.apple.com/search?term=' + term + '&entity=song&limit=5')
    .then(response => response.json())
    .then(data => {
      if (requestId !== searchNumber || centovaLoaded) return;

      if (data.results && data.results.length > 0) {
        const result = data.results.find(item => item.artworkUrl100);

        if (result) {
          const imageUrl = result.artworkUrl100.replace('100x100bb', '300x300bb');
          showImage(imageUrl, requestId);
          return;
        }
      }

      showNote();
    })
    .catch(() => {
      if (requestId === searchNumber && !centovaLoaded) {
        showNote();
      }
    });
}

function loadFallback(song, requestId) {
  if (fallbackStarted || centovaLoaded) return;

  fallbackStarted = true;
  searchOnline(song, requestId);
}

function checkCentovaImage() {
  if (!allowCentovaUpdate) return;

  const url = centovaArt.getAttribute('src');

  if (!url || url === 'undefined' || url === 'null') return;

  if (url === displayedCentovaUrl) return;
  if (url === candidateCentovaUrl) return;

  candidateCentovaUrl = url;

  const requestId = searchNumber;
  const testImage = new Image();

  testImage.onload = function() {
    if (requestId !== searchNumber || !allowCentovaUpdate) return;

    centovaLoaded = true;
    displayedCentovaUrl = url;
    candidateCentovaUrl = "";
    allowCentovaUpdate = false;

    showImage(url, requestId);
  };

  testImage.onerror = function() {
    if (requestId === searchNumber) {
      candidateCentovaUrl = "";
      centovaLoaded = false;
    }
  };

  testImage.src = url;
}

centovaArt.addEventListener('load', checkCentovaImage);

centovaArt.addEventListener('error', function() {
  centovaLoaded = false;
  candidateCentovaUrl = "";
});

function fetchSong() {
  fetch('https://usa3.fastcast4u.com/rpc/william/streaminfo.get', {
    cache: 'no-store'
  })
    .then(response => response.json())
    .then(data => {
      if (data && data.type === 'result' && data.data && data.data[0]) {
        const track = data.data[0];

        if (track.song && track.song !== currentSong) {
          currentSong = track.song;
          songTitle.innerText = currentSong;

          searchNumber++;
          const requestId = searchNumber;

          fallbackStarted = false;
          centovaLoaded = false;
          candidateCentovaUrl = "";
          allowCentovaUpdate = true;

          showNote();
          checkCentovaImage();

          setTimeout(() => {
            if (requestId !== searchNumber) return;

            checkCentovaImage();

            if (!centovaLoaded) {
              loadFallback(currentSong, requestId);
            }
          }, 8000);
        }
      }
    })
    .catch(() => {});
}

setInterval(fetchSong, 2000);
setInterval(checkCentovaImage, 2000);

fetchSong();
</script>
</body>
</html>
